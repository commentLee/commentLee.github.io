<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portfolio PDF</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f3f1eb;
      padding: 24px;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 220px;
      padding: 18px 28px;
      border-radius: 999px;
      background: #111111;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
      text-decoration: none;
    }

    a:hover,
    a:focus-visible {
      background: #2b2b2b;
    }
  </style>
</head>
<body>
  <main>
    <a href="assets/lee_jooseok.pdf" download="LEEJOOSEOK_portfolio.pdf">PDF 다운로드</a>
  </main>
</body>
</html>
